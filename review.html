<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08080b"><title>Отзыв — Мастер</title><link rel="stylesheet" href="styles.css"></head><body><div class="app-shell"><main class="screen form-screen"><header class="topbar"><a class="back-button" href="order-status.html">‹</a><div class="form-title"><p class="eyebrow">ЗАКАЗ №1042 · ЗАВЕРШЁН</p><h1>Как всё прошло?</h1></div><div></div></header><section class="review-hero"><div class="master-avatar">АП</div><h2>Алексей Петров</h2><p class="muted">Ремонт стиральной машины</p></section><section class="form-section"><label class="field-label">Ваша оценка</label><div class="stars" id="stars"><button onclick="rate(1)">★</button><button onclick="rate(2)">★</button><button onclick="rate(3)">★</button><button onclick="rate(4)">★</button><button onclick="rate(5)">★</button></div></section><section class="form-section"><label class="field-label" for="reviewText">Отзыв <span class="muted">необязательно</span></label><textarea id="reviewText" placeholder="Расскажите, как прошёл заказ"></textarea></section><label class="check-row"><input type="checkbox" id="publish" checked><span><b>Опубликовать отзыв в ленте</b><small>Ваш отзыв будет виден другим пользователям Иваново. Публикуется только после завершённого заказа.</small></span></label><button class="primary-button full-width" onclick="submitReview()">Опубликовать отзыв</button><p class="privacy-note">Изменить или удалить отзыв можно будет через поддержку.</p></main><nav class="bottom-nav"><a class="nav-item" href="index.html"><span>⌂</span><small>Лента</small></a><a class="nav-item active" href="orders.html"><span>▣</span><small>Заказы</small></a><a class="nav-item" href="messages.html"><span>◌</span><small>Сообщения</small></a><a class="nav-item" href="account.html"><span>◯</span><small>Аккаунт</small></a></nav></div><script>let rating=5;function rate(n){rating=n;document.querySelectorAll('#stars button').forEach((b,i)=>b.classList.toggle('selected',i<n))}function submitReview(){if(!rating){alert('Поставьте оценку');return}alert('Спасибо! Отзыв сохранён как отзыв к завершённому заказу.');location.href='index.html'}</script></body></html>
