<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08080b"><title>Отзыв — Мастер</title><link rel="stylesheet" href="styles.css"><style>.review-hero{text-align:center;padding:10px 0 25px}.review-hero .master-avatar{margin:0 auto 14px}.review-hero h2{font-size:20px}.stars{display:flex;gap:6px}.stars button{flex:1;height:54px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:#555;font-size:25px}.stars button.selected{border-color:rgba(229,57,53,.55);background:var(--accent-soft);color:#ffd36a}.check-row{display:flex;gap:11px;margin:0 0 22px;padding:14px;border:1px solid var(--line);border-radius:15px;background:var(--surface);cursor:pointer}.check-row input{margin-top:2px;accent-color:var(--accent)}.check-row b,.check-row small{display:block}.check-row b{font-size:12px}.check-row small{margin-top:5px;color:var(--muted);font-size:10px;line-height:1.4}</style></head><body><div class="app-shell"><main class="screen form-screen"><header class="topbar"><a class="back-button" href="order-status.html">‹</a><div class="form-title"><p class="eyebrow">ЗАКАЗ №1042 · ЗАВЕРШЁН</p><h1>Как всё прошло?</h1></div><div></div></header><section class="review-hero"><div class="master-avatar">АП</div><h2>Алексей Петров</h2><p class="muted">Ремонт стиральной машины</p></section><section class="form-section"><label class="field-label">Ваша оценка</label><div class="stars" id="stars"><button onclick="rate(1)">★</button><button onclick="rate(2)">★</button><button onclick="rate(3)">★</button><button onclick="rate(4)">★</button><button onclick="rate(5)">★</button></div></section><section class="form-section"><label class="field-label" for="reviewText">Отзыв <span class="muted">необязательно</span></label><textarea id="reviewText" placeholder="Расскажите, как прошёл заказ"></textarea></section><label class="check-row"><input type="checkbox" id="publish" checked><span><b>Опубликовать отзыв в ленте</b><small>Ваш отзыв будет виден другим пользователям Иваново. Публикуется только после завершённого заказа.</small></span></label><button class="primary-button full-width" onclick="submitReview()">Опубликовать отзыв</button><p class="privacy-note">Отзыв можно оставить только по завершённому заказу.</p></main><nav class="bottom-nav"><a class="nav-item" href="index.html"><span>⌂</span><small>Лента</small></a><a class="nav-item active" href="orders.html"><span>▣</span><small>Заказы</small></a><a class="nav-item" href="messages.html"><span>◌</span><small>Сообщения</small></a><a class="nav-item" href="account.html"><span>◯</span><small>Аккаунт</small></a></nav></div><script>let rating=5;rate(5);function rate(n){rating=n;document.querySelectorAll('#stars button').forEach((b,i)=>b.classList.toggle('selected',i<n))}function submitReview(){const text=document.getElementById('reviewText').value.trim();alert('Отзыв сохранён к завершённому заказу'+(text?' и готов к публикации.':' .'));location.href='index.html'}</script></body></html>
