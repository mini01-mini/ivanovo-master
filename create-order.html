<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08080b"><title>Создать заказ — Мастер</title><link rel="stylesheet" href="styles.css"></head><body><div class="app-shell"><main class="screen form-screen"><header class="topbar form-topbar"><a class="back-button" href="index.html">‹</a><div class="form-title"><p class="eyebrow">НОВЫЙ ЗАКАЗ</p><h1>Найдём мастера</h1></div><div class="step-count">1 / 3</div></header><div class="progress"><span></span></div><form id="orderForm"><section class="form-section"><p class="section-label">01 · ПРОБЛЕМА</p><h2>Что случилось?</h2><p class="helper">Выберите категорию, чтобы заказ попал подходящим мастерам.</p><div class="category-grid"><button type="button" class="category-option selected" data-category="Стиральная машина"><span>🧺</span><b>Стиральная<br>машина</b></button><button type="button" class="category-option" data-category="Холодильник"><span>❄️</span><b>Холодильник</b></button><button type="button" class="category-option" data-category="Сантехника"><span>🚰</span><b>Сантехника</b></button><button type="button" class="category-option" data-category="Электрика"><span>⚡</span><b>Электрика</b></button></div></section><section class="form-section"><label class="field-label" for="problem">Коротко опишите проблему</label><textarea id="problem" required placeholder="Например: стиральная машина включается, но не сливает воду"></textarea></section><section class="form-section"><p class="field-label">Фото проблемы <span class="required">обязательно</span></p><label class="upload-box" for="photo"><span class="upload-icon">＋</span><b>Добавить фото</b><small>Мастер увидит проблему до выезда</small></label><input id="photo" type="file" accept="image/*" required hidden><label class="upload-box secondary-upload" for="video"><span class="upload-icon">＋</span><b>Добавить видео</b><small>Необязательно · можно показать звук или неисправность</small></label><input id="video" type="file" accept="video/*" hidden></section><section class="form-section two-fields"><div><label class="field-label" for="brand">Бренд / модель</label><input id="brand" type="text" placeholder="Например, LG"></div><div><label class="field-label" for="budget">Бюджет, ₽</label><input id="budget" type="number" min="0" placeholder="2000"></div></section><section class="form-section"><label class="field-label" for="address">Адрес выезда</label><input id="address" type="text" required placeholder="Иваново, улица, дом, квартира"></section><section class="form-section"><p class="field-label">Когда нужен мастер?</p><div class="urgency-options"><button type="button" class="urgency selected">⚡ Срочно</button><button type="button" class="urgency">Сегодня</button><button type="button" class="urgency">Когда удобно</button></div></section><button class="primary-button full-width" type="submit">Посмотреть заказ</button><p class="privacy-note">Перед публикацией вы увидите все данные заказа и сможете их изменить.</p></form></main><nav class="bottom-nav"><a class="nav-item" href="index.html"><span>⌂</span><small>Лента</small></a><a class="nav-item active" href="#"><span>＋</span><small>Заказ</small></a><a class="nav-item" href="messages.html"><span>◌</span><small>Сообщения</small></a><a class="nav-item" href="account.html"><span>◯</span><small>Аккаунт</small></a></nav></div><script>const cats=document.querySelectorAll('.category-option');cats.forEach(b=>b.onclick=()=>{cats.forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});const urg=document.querySelectorAll('.urgency');urg.forEach(b=>b.onclick=()=>{urg.forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});photo.onchange=e=>{if(e.target.files.length){document.querySelector('label[for=photo]').classList.add('uploaded');document.querySelector('label[for=photo] b').textContent='Фото добавлено ✓'}};video.onchange=e=>{if(e.target.files.length){document.querySelector('label[for=video]').classList.add('uploaded');document.querySelector('label[for=video] b').textContent='Видео добавлено ✓'}};orderForm.onsubmit=e=>{e.preventDefault();if(problem.value.trim()&&address.value.trim()&&photo.files.length)location.href='order-preview.html'};</script></body></html>
